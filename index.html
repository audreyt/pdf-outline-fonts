<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pdf-outline-fonts</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>pdf-outline-fonts</h1>
        <p data-i18n="intro">
          Convert specific PDF fonts to vector outlines, in your browser. The
          file never leaves this page. Defaults to every font whose BaseFont
          starts with <code>jf-</code>.
        </p>
      </header>

      <section id="drop" class="drop">
        <p data-i18n="drop">Drop a PDF here, or click to choose.</p>
        <input id="file" type="file" accept="application/pdf,.pdf" hidden />
      </section>

      <section class="config">
        <label>
          <span data-i18n="prefixesLabel">Prefixes</span>
          <input
            id="prefixes"
            type="text"
            value="jf-"
            placeholder="jf-, gen-"
            data-i18n-placeholder="prefixesPlaceholder"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
          />
        </label>
        <label>
          <span data-i18n="exactsLabel">Exact BaseFonts</span>
          <input
            id="exacts"
            type="text"
            value=""
            placeholder="MyFont-Bold"
            data-i18n-placeholder="exactsPlaceholder"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
          />
        </label>
        <label class="checkbox">
          <input id="selectionLayer" type="checkbox" checked />
          <span data-i18n="selectionLayer">Add invisible selection layer (Droid Sans Fallback)</span>
        </label>
      </section>

      <p id="status" class="status"></p>

      <a id="download" class="download" hidden data-i18n="download">Download outlined PDF</a>

      <pre id="log" class="log"></pre>

      <footer>
        <p>
          <a href="https://github.com/audreyt/pdf-outline-fonts" data-i18n="sourceLink">Source on GitHub</a>
          · CC0 1.0
        </p>
      </footer>
    </main>

    <script type="importmap">
      {
        "imports": {
          "mupdf": "https://cdn.jsdelivr.net/npm/mupdf@1.27.0/dist/mupdf.js"
        }
      }
    </script>
    <script type="module" src="./web.js"></script>
  </body>
</html>
